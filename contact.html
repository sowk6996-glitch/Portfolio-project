<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | CodeFolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">CodeFolio</div>

    <nav class="nav-links">
      <a href="index1.html">Home</a>
      <a href="about.html">About</a>
      <a href="templates.html">Templates</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <!-- Contact Section -->
  <main class="contact-page">

    <section class="contact-hero">
      <h1>Contact Us</h1>
      <p>We'd love to hear from you. Send us your questions or feedback.</p>
    </section>

    <section class="contact-container">

      <div class="contact-info">
        <h2>Get in Touch</h2>
        <p><strong>Email:</strong> support@codefolio.com</p>
        <p><strong>Phone:</strong> +91 98765 43210</p>
        <p><strong>Location:</strong> Bengaluru, Karnataka, India</p>
      </div>

      <div class="contact-form">
        <form>

          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
          >

          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >

          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            placeholder="Enter subject"
            required
          >

          <label for="message">Message</label>
          <textarea
            id="message"
            rows="6"
            placeholder="Write your message here..."
            required
          ></textarea>

          <button type="submit">Send Message</button>

        </form>
      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 CodeFolio. All Rights Reserved.</p>
  </footer>
<script src="script.js"></script>
</body>
</html>
